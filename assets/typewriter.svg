<svg xmlns="http://www.w3.org/2000/svg" width="430" height="74" viewBox="0 0 430 74" role="img" aria-labelledby="title desc">
  <title id="title">您好，我是师利强</title>
  <desc id="desc">橙色文字以打字机效果反复出现和回退。</desc>
  <style>
    .typed {
      fill: #ff6a00;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 42px;
      font-weight: 750;
      letter-spacing: 0;
    }
    .reveal { animation: reveal 7s steps(8, end) infinite; }
    .cursor {
      fill: #ff6a00;
      animation: cursor-move 7s steps(8, end) infinite, cursor-blink 0.72s step-end infinite;
    }
    @keyframes reveal {
      0% { width: 0; }
      35%, 63.6% { width: 336px; }
      98.6%, 100% { width: 0; }
    }
    @keyframes cursor-move {
      0% { transform: translateX(0); }
      35%, 63.6% { transform: translateX(336px); }
      98.6%, 100% { transform: translateX(0); }
    }
    @keyframes cursor-blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal { animation: none; width: 336px; }
      .cursor { display: none; }
    }
  </style>
  <defs>
    <clipPath id="typing-clip" clipPathUnits="userSpaceOnUse">
      <rect class="reveal" x="18" y="0" width="336" height="74" />
    </clipPath>
  </defs>
  <text class="typed" x="18" y="52" textLength="336" lengthAdjust="spacingAndGlyphs" clip-path="url(#typing-clip)">您好，我是师利强</text>
  <rect class="cursor" x="18" y="12" width="3" height="46" rx="1.5" />
</svg>
